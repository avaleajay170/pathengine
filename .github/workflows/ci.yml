# Runs the same gates as `npm run verify`, in the same order, so a green local run and a green
# CI run mean the same thing. If you add a gate to one, add it to the other.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here publishes, comments or tags.
permissions:
  contents: read

# A new push to a branch makes the in-flight run for that branch irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth for the Node version, shared with local dev.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it installs the lockfile exactly and fails if the
      # lockfile has drifted from package.json, which is the signal we want in CI.
      - run: npm ci

      # Cheapest checks first, so an obvious failure does not wait on a build.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # Build last, and only after types pass: `vite build` does not typecheck.
      - run: npm run build
